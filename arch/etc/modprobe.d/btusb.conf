# MediaTek MT7922 (0e8d:0616) の Bluetooth を USB オートサスペンドから守る。
#
# btusb の enable_autosuspend は既定で Y。MT7922 のコンボカードはこれが効くと
# 起動直後 (autosuspend_delay_ms=2000 の 2 秒後) にサスペンドし、そのまま
# WMT コマンドに応答しなくなる:
#
#   Bluetooth: hci0: Execution of wmt command timed out
#   Bluetooth: hci0: Failed to send wmt func ctrl (-110)
#
# こうなると bluetoothd の power on が org.bluez.Error.Failed で落ち、
# btusb を再ロードしても probe が -16 (EBUSY) で失敗する。復帰には
# USB の再列挙かコールドブートが要る。
options btusb enable_autosuspend=0
