# greetd 本体の設定。
#
# greetd は「認証してセッションを起動する」だけで画面を描く機能を持たないので、
# cage (ウィンドウ 1 枚だけを全画面表示する最小の Wayland コンポジタ) を挟み、
# その上で regreet (GTK4 のグリーター UI) を動かす。
#   -s        Ctrl+Alt+F2 などでの VT 切り替えを許可する
#   -m last   複数のディスプレイが繋がっているときは最後の 1 枚にだけ出す
[terminal]
vt = 1

[default_session]
command = "cage -s -m last -- regreet"
user = "greeter"
