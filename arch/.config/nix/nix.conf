# ubuntu/.config/nix/nix.conf と同じ。ユーザー単位の設定なので sudo は不要。
#
# Arch の nix パッケージ (extra/nix) は /etc/nix/nix.conf に build-users-group しか
# 書かないため、flakes と nix コマンドは自分で有効にする必要がある。
# darwin は Determinate Nix が最初から有効にしているので、この行は arch/ubuntu だけ。
experimental-features = nix-command flakes

# --- Arch での nix の使い方 (方針) ---
#
# Arch では nix はプロジェクト単位のバージョン管理にだけ使う。ユーザー環境の
# パッケージは pacman が持つ (fish / neovim / fzf / bat / zoxide / direnv など)。
# darwin は nix-darwin + home-manager で環境ごと管理し、ubuntu は home-manager を
# 使うが、arch はそこに寄せない。pacman と二重管理になるため。
# よって arch/.config/nix/ に flake.nix / home.nix は置かない (この 1 ファイルだけ)。
#
# 使い方: プロジェクト側に flake.nix を置き、.envrc に「use flake」の 1 行を書いて
# direnv allow する。これだけで良い。
#   - nix profile install は使わないので ~/.nix-profile は作られない。
#     PATH に ~/.nix-profile/bin を足す必要は無い。
#   - nix-direnv も要らない。direnv 2.37 の stdlib に use_flake が内蔵されており、
#     --profile .direnv/flake-profile を作るので GC root は確保される
#     (nix-collect-garbage で devshell が消えない)。flake.nix/flake.lock の
#     watch_file と古い世代の wipe-history も入っている。
#     nix-direnv が上回るのは再入場の速さだけ (評価済み env をキャッシュして
#     nix の起動を省く)。遅さが気になったら pacman -S nix-direnv して
#     ~/.config/direnv/direnvrc に source /usr/share/nix-direnv/direnvrc を書く。
#
# 詰まりどころ: pacman 版は tmpfiles で /nix/var/nix/{daemon-socket,builds} しか
# 作らず、/nix/store は nix-daemon が初回接続時に作る。ところがクライアントは
# 接続前に /nix/store を見るので、初回の nix build が
#   error: opening file "/nix/store": No such file or directory
# で落ちてソケット起動が発火しない。`nix store info` を一度叩けば daemon が
# 起動して /nix/store を作り、以降は正常になる。
