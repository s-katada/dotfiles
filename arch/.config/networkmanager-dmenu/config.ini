# networkmanager-dmenu の設定。Mod+Shift+W と waybar のネットワークアイコンから呼ぶ。
#
# 一覧の描画は ~/.local/bin/nm-vicinae (dotfiles: arch/.local/bin/nm-vicinae) が
# 担当する。networkmanager_dmenu が吐く行をそのまま見せると読めたものではないので、
# macOS の Wi-Fi メニュー風に整形してから vicinae に渡すラッパを噛ませている。
# 詳しい仕組みはそのスクリプトの docstring を参照。
#
# sh -c 経由で呼んでいるのは、~/.local/bin が systemd ユーザーセッションの PATH に
# 入っていないため。niri が spawn する子プロセスも同じ PATH を継ぐので、
# networkmanager_dmenu からは nm-vicinae を名前で解決できない。$HOME を展開させる
# ためだけにシェルを1枚挟んでいる (dotfiles にユーザー名を焼き込まないため)。

[dmenu]
dmenu_command = sh -c 'exec "$HOME/.local/bin/nm-vicinae"'

# ラッパが解釈する区切り。AP の行だけにこの形式が適用されるので、
# 区切り文字の有無が「AP か、それ以外 (保存済み接続・操作項目) か」の判別になる。
# U+241F は SSID に現れる可能性が事実上ない。
format = {name}␟{sec}␟{signal}

# 接続中の印。ラッパ側の ACTIVE_CHARS と一致させること。
active_chars = ✓

# 空行の区切りを挿入させない。区切りは選択できてしまい (Action("", None) を
# 呼んで落ちる)、macOS 風の見た目にも要らない。
compact = True

# 保存済みの接続も一覧に出す (macOS が「以前接続したネットワーク」を出すのと同じ)
list_saved = True

# パスワード入力。vicinae dmenu は一覧から選ぶ UI であって自由入力を返さないうえ、
# 伏字にする手段も無い。専用の pinentry に投げる。
pinentry = pinentry-gnome3

# highlight は rofi / wofi 専用。有効なままだとラッパに渡る行の形が変わるので切る。
highlight = False

[pinentry]
description = Wi-Fi のパスワード
prompt = パスワード:

[editor]
# 「ネットワーク設定を開く…」で開くもの。nm-connection-editor は未インストール
# なので、実際には terminal 経由で nmtui が開く。GUI が欲しくなったら
#   sudo pacman -S nm-connection-editor
# を入れればこちらが使われる。
terminal = ghostty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
