# ~/.local/bin を PATH に入れる。
#
# systemd のユーザーマネージャが持つ PATH には ~/.local/bin が含まれていない。
# niri は systemd のユーザーサービスとして起動しているので、niri が spawn する
# 子プロセス (waybar など) もこの PATH をそのまま継ぐ。結果、そこから起動される
# プログラムは ~/.local/bin のスクリプトを名前で解決できない。
#
# これまでは呼び出し側で回避していた:
#   - niri config:  spawn-sh "~/.local/bin/niriswitcher-patched"  (~ を展開するため)
#   - niri config:  spawn-sh "~/.local/bin/chrome-profile ..."
#   - networkmanager-dmenu: dmenu_command = sh -c 'exec "$HOME/.local/bin/nm-vicinae"'
# いずれも「dotfiles にユーザー名を焼き込まない」ためにシェルを噛ませているだけで、
# PATH さえ通っていれば要らない小細工。ただしこの設定が効いていない環境 (別の
# ログイン方法、systemd を介さない起動) でも動くほうが安全なので、呼び出し側は
# そのまま残してある。整理したくなったら次回ログイン後に外せる。
#
# $PATH の展開は systemd の environment.d が行う (man 5 environment.d の
# "variable expansion")。先に定義済みの変数しか参照できないが、PATH と HOME は
# 継承済みなので問題ない。
#
# 反映は次回ログインから。稼働中のセッションの PATH は変わらない。
PATH=$HOME/.local/bin:$PATH
