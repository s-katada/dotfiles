# GUI アプリの UI 言語を日本語にする (systemd のユーザーマネージャが読む)。
#
# LANG は /etc/locale.conf で en_US.UTF-8 のままにしてある。LANG を ja_JP.UTF-8 に
# すると端末のエラーメッセージまで日本語になり、日付・数値の書式やソート順も
# 変わって検索しづらくなる。LANGUAGE は gettext と Chromium 系が見る
# 「UI の言語」だけの変数なので、UI は日本語・CLI は英語という切り分けができる。
#
# ここは systemd や D-Bus 経由で起動されるアプリ (xdg autostart のものなど) に
# 効く。niri が直接 spawn する子プロセスには niri の environment ブロックが効く。
# 両方に書いておかないと起動経路によって言語が変わる。
LANGUAGE=ja
