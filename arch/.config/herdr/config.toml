# herdr 設定 (Arch)
# darwin/.config/herdr/config.toml から再構成したもの。
# キーバインドは zellij の操作感に寄せている。
# 対応表と妥協点は darwin/.config/herdr/README.md を参照。
# 反映: herdr server reload-config
#
# darwin との差分: Arch の herdr は上流の非パッチ版なので、darwin 側の自前パッチ
# 専用オプション (prefix_sticky / lock / prefix_cheatsheet) と macOS 専用の
# 入力ソース切替は外してある。プレフィックスは 1 アクションで抜ける one-shot。

onboarding = false

[keys]
# zellij の Pane モードキー (Ctrl p) をプレフィックスに採用。
# プレフィックス2度押しでリテラル ctrl+p をペイン内アプリへ送信。
prefix = "ctrl+p"

# ペイン操作 (zellij: Ctrl p → キー / Alt+キー)
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]
split_horizontal = ["prefix+d", "prefix+minus"]
split_vertical = ["prefix+r", "prefix+n", "alt+n"]
close_pane = "prefix+x"
zoom = ["prefix+f", "prefix+z"]
rename_pane = "prefix+c"
cycle_pane_next = ["prefix+p", "prefix+tab"]
cycle_pane_previous = "prefix+shift+tab"

# ペイン入替 (zellij: Ctrl m → h/j/k/l 相当)
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# リサイズモード (zellij: Ctrl n → h/j/k/l → Ctrl n/Esc)
resize_mode = "ctrl+n"

# スクロール/コピー (zellij: Ctrl s → スクロールモード)
copy_mode = ["ctrl+s", "prefix+["]
edit_scrollback = "prefix+e"

# タブ (zellij: Ctrl t → キー の代替。モーダル方式は再現不可のため直接チョードに分散)
new_tab = ["prefix+t", "alt+t"]
close_tab = "prefix+shift+x"
rename_tab = "prefix+shift+t"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
switch_tab = ["prefix+1..9", "alt+1..9"]

# セッション (zellij: Ctrl o → d / w 相当)
detach = "prefix+q"
workspace_picker = "prefix+w"
goto = "prefix+g"
open_notification_target = "prefix+o"
toggle_sidebar = "prefix+b"

# エージェント / ワークスペース番号ジャンプ (並列時の「探す」を減らす)
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

# worktrunk: worktree を今の workspace 内のタブとして開く/作成
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree picker (tab mode)"

# ペイン幅を等分（分割時は自動。手動リサイズ後に戻す用）
[[keys.command]]
key = "prefix+="
type = "plugin_action"
command = "shibayu36.equalize-panes.equalize"
description = "equalize panes"

# reviewr: エージェントの diff レビューペインを開閉
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

# herdr-sidebar: ファイルツリー（必要なときだけ。auto_open はオフ推奨）
[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "toggle file sidebar"

# annotate: 画面テキスト / エージェント返答への付箋
# (公式例の prefix+o は通知ジャンプと衝突するため prefix+alt+o にずらしている)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selection"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations and archive"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "annotate agent's last message"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "annotate.open"
description = "annotate: review docs here"

# ペインを新規タブに分離 (zellij: Ctrl t → b の BreakPane 相当)
[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = '"$HERDR_BIN_PATH" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'
description = "break pane to new tab"

# herdr 終了 (zellij: Ctrl o → q の Quit 相当。確認なしで即停止する点に注意)
[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = '"$HERDR_BIN_PATH" server stop'
description = "quit herdr (stop server)"

[session]
# herdr サーバーが再起動 (再起動・herdr server stop・マシン再起動) しても、AI
# エージェントのペインを元の会話セッションに復帰させる。claude なら
# `claude --resume <session-id>` 相当を自動で行うので、herdr を開き直すだけで
# 会話の続きから再開できる。
#
# pane_history (下の [experimental]) は画面の見た目を保存するだけで、中身の
# 会話は復元しない。会話まで戻すのはこちらの設定。
#
# 動作には「セッション ID を herdr に通知する」公式インテグレーションが必要:
#   herdr integration install claude
# これは ~/.claude/hooks/herdr-agent-state.sh を置き、~/.claude/settings.json に
# SessionStart フックを追記する (どちらもこのリポジトリの管理外)。
# 状態確認: herdr integration status
resume_agents_on_restore = true

[theme]
name = "catppuccin"

[ui]
# blocked → working → done の順。要対応が常に上に来る。
agent_panel_sort = "priority"
# 色だけでなく形で状態を区別 (blocked / working / done / idle)。
status_indicators = "symbols"
# 単一ペインでも枠を出し、エージェントラベルが見えるようにする。
pane_borders = "always"
pane_outer_borders = true
show_agent_labels_on_pane_borders = true
# 外側端末のタブ / ウィンドウタイトルでも今どこか分かる。
window_title = "{workspace} · {tab}"
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

# サイドバー Agents: どのプロジェクトの何をしているかを一行で把握する。
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
  ["terminal_title_stripped"],
]

# サイドバー Spaces: リポジトリ単位のロールアップ + git 状態。
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
# バックグラウンドの要対応を in-app toast で知らせる。
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[experimental]
pane_history = true

# ペイン内の画像表示 (kitty graphics protocol) を通す。
#
# 既定では無効で、その状態では画像を送るプログラムの出力が herdr に飲み込まれて
# 何も表示されない。yazi の画像プレビューが出なかったのがこれ。素の ghostty で
# 同じ yazi を動かすと実画像が出たので、端末側ではなく herdr 側の問題だと切り分けた。
#
# yazi は chafa (ブロック文字による代替描画) へフォールバックしない。pty を割り当てて
# 計測したところ、TERM を変えても常に kitty graphics の APC シーケンスを送っていた。
# つまりこのフラグを立てる以外に herdr の中で画像を出す方法は無い。
#
# experimental なので不具合を踏む可能性はある。おかしくなったらこの行を消して
# herdr server reload-config で戻せる。
kitty_graphics = true
