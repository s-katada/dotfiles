<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  総称フォント名 (sans-serif / serif / monospace) の解決先を決める。

  なぜ必要か:
    Noto CJK は JP / KR / SC / TC の 4 変種が 1 つのフォントファミリ群として
    入っており、優先順位を書かないと fontconfig は日本語に対して韓国語版を
    選ぶことがある。実際この環境では設定前、3 つの総称名すべてが KR に
    解決していた:
      fc-match 'sans-serif:lang=ja' -> Noto Sans CJK KR
      fc-match 'serif:lang=ja'      -> Noto Serif CJK KR
      fc-match 'monospace:lang=ja'  -> Noto Sans Mono CJK KR
    KR 版は漢字が韓国字形なので、日本語の字形として不正確なものが混ざる
    (直・骨・次 などが日本の字形と異なる)。

  方針:
    欧文フォントを先に置き、その後ろに日本語版の Noto CJK を置く。
    こうすると英数字は欧文フォントで組まれ、欧文フォントが持たない
    日本語のグリフだけが Noto CJK JP から補われる。逆順にすると
    英数字まで CJK フォントの従属欧文で組まれてしまう。

  欧文側の選択:
    Adwaita Sans は GNOME の現行 UI フォント (Inter 系)。この環境の GTK は
    ライト寄せで Adwaita アイコンテーマを使っているので、それに合わせる。
    等幅は Adwaita Mono を使う (ターミナルは ghostty が自前のフォントを
    持っているのでここの設定は影響しない)。
-->
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Noto Serif CJK JP</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Adwaita Mono</family>
      <family>Noto Sans Mono CJK JP</family>
    </prefer>
  </alias>

  <!--
    上の prefer は言語を問わず JP を先に置くので、そのままだと韓国語・中国語の
    ページまで日本語字形で描かれてしまう (実測: fc-match 'sans-serif:lang=ko' が
    Noto Sans CJK JP になった)。各言語のときはその言語の版を先に戻す。
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>

  <!--
    総称名を経由せず "Noto Sans CJK" のように変種を書かずに指定された場合も
    JP を優先する。Web ページや一部アプリがこう書いてくることがある。
  -->
  <alias binding="strong">
    <family>Noto Sans CJK</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Noto Serif CJK</family>
    <prefer><family>Noto Serif CJK JP</family></prefer>
  </alias>

</fontconfig>
