# ============================================================================
# tmux 設定 — Catppuccin Mocha テーマ + Zellij風キーバインドヒント
# ============================================================================
#
# Catppuccin Mocha パレット:
#   base=#1e1e2e  mantle=#181825  crust=#11111b
#   surface0=#313244  surface1=#45475a  surface2=#585b70
#   overlay0=#6c7086  overlay1=#7f849c  overlay2=#9399b2
#   text=#cdd6f4  subtext0=#a6adc8  subtext1=#bac2de
#   blue=#89b4fa  green=#a6e3a1  peach=#fab387  red=#f38ba8
#   mauve=#cba6f7  pink=#f5c2e7  teal=#94e2d5  yellow=#f9e2af
#   sky=#89dceb  sapphire=#74c7ec  lavender=#b4befe

# --- 基本設定 ---------------------------------------------------------------

set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g display-time 2000
set -g display-panes-time 2000
set -g status 2

# --- キーバインド -----------------------------------------------------------

# ペイン分割（直感的なキー + カレントパス維持）
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ペイン移動（vim風）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインリサイズ（リピート可能）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 新規ウィンドウはカレントパスで開く
bind c new-window -c "#{pane_current_path}"

# 設定リロード
bind r source-file ~/.config/tmux/tmux.conf \; display "設定をリロードしました"


# ポップアップ（Alt+f でトグル）
bind -n M-f display-popup -E -w 80% -h 80%

# --- コピーモード（vi スタイル）----------------------------------------------

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# --- ステータスバー 1行目（タブバー）-----------------------------------------

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-justify left

# 左側：セッション名
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#89b4fa] "
set -g status-left-length 30

# 右側：ホスト名と時刻
set -g status-right "#[fg=#585b70]│ #[fg=#bac2de]#h #[fg=#585b70]│ #[fg=#fab387]%H:%M "
set -g status-right-length 50

# ウィンドウタブ（アクティブ）
set -g window-status-current-format "#[bg=#313244,fg=#a6e3a1,bold] #I:#W#{?window_zoomed_flag, 󰁌,} "

# ウィンドウタブ（非アクティブ）
set -g window-status-format "#[bg=#1e1e2e,fg=#7f849c] #I:#W "

# 区切りなし（フォーマット内で制御）
set -g window-status-separator ""

# --- ステータスバー 2行目（キーバインドヒント）---------------------------------

set -g status-format[1] "#[align=centre,bg=#181825] #[fg=#89b4fa,bold]^b \"#[fg=#bac2de,nobold] Split-V #[fg=#585b70]│ #[fg=#89b4fa,bold]^b %#[fg=#bac2de,nobold] Split-H #[fg=#585b70]│ #[fg=#a6e3a1,bold]^b c#[fg=#bac2de,nobold] New #[fg=#585b70]│ #[fg=#fab387,bold]^b d#[fg=#bac2de,nobold] Detach #[fg=#585b70]│ #[fg=#f5c2e7,bold]^b [#[fg=#bac2de,nobold] Copy #[fg=#585b70]│ #[fg=#cba6f7,bold]^b ?#[fg=#bac2de,nobold] Keys #[fg=#585b70]│ #[fg=#f38ba8,bold]^b x#[fg=#bac2de,nobold] Kill #[fg=#585b70]│ #[fg=#94e2d5,bold]^b z#[fg=#bac2de,nobold] Zoom #[fg=#585b70]│ #[fg=#f9e2af,bold]^b r#[fg=#bac2de,nobold] Reload "

# --- 外観 -------------------------------------------------------------------

# ペインボーダー
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# メッセージ
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# コピーモード選択
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# クロック
set -g clock-mode-colour "#89b4fa"
